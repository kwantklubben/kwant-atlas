name: Content checks

# Fast gate for the CONTENT itself, on every push/PR to main. Kept to ~1-2 minutes so it can
# run on every push; the deep python-fence check lives in fence-check.yml instead (it takes
# 10-30 minutes and is report-only, so it does not belong in a per-push gate).
#
# Gates:
#   1. the site builds                  -- a bad title/backslash in YAML frontmatter breaks it
#   2. every wikilink resolves          -- catches dangling links and dead _legacy pointers
#   3. the visualizer is not stale      -- node paths/edges are generated from the content tree

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Quartz
        run: npx quartz build

      - name: Check wikilinks resolve
        run: python3 corpus/tools/check_links.py

      - name: Check the visualizer is not stale
        run: python3 corpus/tools/build_visualizer.py --check
