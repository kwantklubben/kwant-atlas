name: Deploy Kwant Atlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Build Quartz
        run: npx quartz build
      - name: Copy Standalone Visualizer and CNAME
        run: |
          echo "atlas.kwantklubben.com" > public/CNAME
          rm -f public/visualizer
          mkdir -p public/visualizer
          cp content/visualizer.html public/visualizer/index.html
          cp content/visualizer.html public/visualizer.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
